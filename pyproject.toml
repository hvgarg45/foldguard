[project]
name = "foldguard"
version = "0.1.0"
description = "Decide whether a predicted protein structure is good enough for what you are about to do with it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
foldguard = "foldguard.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foldguard*"]

# TEMPORARY diagnostic. Delete once the Claude Code Review failure is resolved.
#
# The review action hides its SDK output "for security", and its own workflow
# validation rejects any PR that edits it - so the suppressed error cannot be
# observed from a branch. This probe sidesteps both: a separate workflow (no
# validation), printing only HTTP status codes and error types, never model
# output. GitHub masks the secret itself.
name: Probe Anthropic API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Key shape and reachable models
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "key length: ${#KEY}  prefix: ${KEY:0:8}"
          echo "--- GET /v1/models ---"
          code=$(curl -sS -o models.json -w '%{http_code}' --max-time 60 \
            https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          echo "http=$code"
          if jq -e '.error' models.json > /dev/null 2>&1; then
            jq -r '"error type: \(.error.type)\nmessage: \(.error.message[0:200])"' models.json
          else
            jq -r '"models available: \(.data | length)"' models.json
            jq -r '.data[].id' models.json | head -15
          fi

      - name: Completion test per model
        if: always()
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for m in claude-opus-5 claude-sonnet-5 claude-haiku-4-5-20251001; do
            code=$(curl -sS -o r.json -w '%{http_code}' --max-time 60 \
              https://api.anthropic.com/v1/messages \
              -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "{\"model\":\"$m\",\"max_tokens\":4,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            if jq -e '.error' r.json > /dev/null 2>&1; then
              echo "$m http=$code $(jq -r '.error.type + " - " + (.error.message[0:150])' r.json)"
            else
              echo "$m http=$code OK"
            fi
          done

# TEMPORARY diagnostic. Delete once the Claude Code Review failure is resolved.
#
# The review action hides its SDK output "for security", and its own workflow
# validation rejects any PR that edits it - so the suppressed error cannot be
# observed from a branch. This probe sidesteps both: it is a separate workflow
# (no validation), it never prints model output, and it reports only HTTP
# status codes and error types. GitHub masks the secret itself.
name: Probe Anthropic API
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which models can this key reach?
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== key shape (no value) ==="
          echo "  length: ${#KEY}   prefix: ${KEY:0:8}…"
          echo
          echo "=== GET /v1/models ==="
          code=$(curl -sS -o /tmp/models.json -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          echo "  http=$code"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/models.json"))
          except Exception as e:
              print("  unparseable response:", e); raise SystemExit
          if "error" in d:
              print("  error type:", d["error"].get("type"))
              print("  message   :", str(d["error"].get("message"))[:200])
          else:
              ids = [m.get("id") for m in d.get("data", [])]
              print(f"  {len(ids)} model(s) available")
              for i in ids[:12]:
                  print("   ", i)
          PY

      - name: Can it actually complete with the model the action uses?
        if: always()
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for m in "claude-opus-5" "claude-sonnet-5" "claude-haiku-4-5-20251001"; do
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 60 \
              https://api.anthropic.com/v1/messages \
              -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "{\"model\":\"$m\",\"max_tokens\":4,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            printf '  %-32s http=%s  ' "$m" "$code"
            python3 -c "
import json,sys
try: d=json.load(open('/tmp/r.json'))
except Exception: print('(unparseable)'); sys.exit()
e=d.get('error')
print(('error: '+str(e.get('type'))+' - '+str(e.get('message'))[:120]) if e else 'OK')
"
          done
